name: ci-release

on:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  ci:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Build
        run: bun run build
      - name: Typecheck
        run: bun run typecheck

  release-artifacts:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: ci
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - name: Install
        run: bun install
      - name: Build
        run: bun run build
      - name: Prepare package directory
        shell: bash
        run: |
          mkdir -p release/package
          cp -R dist release/package/dist
          cp -R src release/package/src
          cp package.json README.md CHANGELOG.md CONTRIBUTING.md SECURITY.md release/package/
      - name: Archive (Linux/macOS)
        if: runner.os != 'Windows'
        shell: bash
        run: |
          name="monsgeek-ts-driver-${{ runner.os }}-${{ github.ref_name }}.tar.gz"
          tar -C release -czf "release/${name}" package
      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          Compress-Archive -Path release/package/* -DestinationPath "release/monsgeek-ts-driver-Windows-${{ github.ref_name }}.zip"
      - name: Build Windows EXE
        if: runner.os == 'Windows'
        run: bun run package:win
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: artifacts-${{ runner.os }}
          path: release/*

  github-release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: release-artifacts
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
      - name: Publish release assets
        uses: softprops/action-gh-release@v2
        with:
          files: artifacts/**/*

